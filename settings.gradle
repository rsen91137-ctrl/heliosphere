pluginManagement {
    repositories {
        maven { name = 'Fabric'; url = 'https://maven.fabricmc.net/' }
        mavenCentral()
        gradlePluginPortal()
    }
}
rootProject.name = 'heliosphere'
include 'core', 'sphereworld', 'industry', 'planets', 'rocketry', 'guide', 'testmod'

// Overlay modules: one per released jar, built on top of the jars in base/ (see jars/README.md, tools/fetch_base.sh).
def overlays = ['01-core', '06-weapons', '10-disasters']
if (new File(rootDir, 'base').list()?.any { it.endsWith('.jar') }) {
    overlays.each { include "jars:$it" }
    if (new File(rootDir, 'build/dist-overlay').exists()) include 'jars:testrun'
}
