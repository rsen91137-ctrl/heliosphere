plugins {
    id 'fabric-loom' version "${loom_version}" apply false
}

subprojects {
    apply plugin: 'fabric-loom'

    version = "${mod_version}+${minecraft_version}"
    group = maven_group
    base { archivesName = "heliosphere-${project.name}" }

    repositories { mavenCentral() }

    dependencies {
        minecraft "com.mojang:minecraft:${minecraft_version}"
        mappings loom.officialMojangMappings()
        modImplementation "net.fabricmc:fabric-loader:${loader_version}"
        modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    }

    processResources {
        inputs.property 'version', project.version
        filesMatching('fabric.mod.json') { expand 'version': project.version }
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.release = 21
        it.options.encoding = 'UTF-8'
    }

    java {
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }
}

// Collect every module jar into build/dist for release.
def released = subprojects.findAll { it.name != 'testmod' }
tasks.register('dist', Copy) {
    dependsOn released.collect { it.tasks.named('remapJar') }
    from(released.collect { it.tasks.named('remapJar') })
    into layout.buildDirectory.dir('dist')
}
