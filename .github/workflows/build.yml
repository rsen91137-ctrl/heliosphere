name: build
on:
  push:
    branches: [ main ]
    paths-ignore: [ 'tools/devlibs/**', '.github/workflows/devlibs.yml', 'README.md' ]
  workflow_dispatch:
    inputs:
      client_test:
        description: 'Run the in-game client test with screenshots'
        default: 'true'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            .gradle/loom-cache
          key: gradle-${{ hashFiles('**/*.gradle', 'gradle.properties') }}
      - name: Install Gradle 9.2.1
        run: |
          for i in 1 2 3 4 5; do
            curl -fsSL --retry 5 https://services.gradle.org/distributions/gradle-9.2.1-bin.zip -o /tmp/g.zip && unzip -q -o /tmp/g.zip -d /tmp && break
            sleep 10
          done
          test -x /tmp/gradle-9.2.1/bin/gradle
      - name: Generate textures and data (deterministic)
        run: |
          pip install --quiet pillow numpy
          python3 tools/gen/javagen.py
          python3 tools/gen/generate.py
      - name: Build all modules
        run: /tmp/gradle-9.2.1/bin/gradle --no-daemon --stacktrace build dist 2>&1 | tee build.log
      - name: Collect jars
        if: always()
        run: |
          mkdir -p out/jars out/logs
          cp build/dist/*.jar out/jars/ 2>/dev/null || true
          curl -sL "https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/0.141.6%2B1.21.11/fabric-api-0.141.6%2B1.21.11.jar" -o "out/jars/fabric-api-0.141.6+1.21.11.jar"
          (cd build/resourcepack/Heliosphere-HD && zip -qr ../../../out/jars/Heliosphere-HD-Resources-32x.zip .)
          cp build.log out/logs/ || true
      - name: Client game test (virtual display)
        if: ${{ github.event_name == 'push' || github.event.inputs.client_test == 'true' }}
        continue-on-error: true
        timeout-minutes: 30
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri mesa-utils > /dev/null
          export LIBGL_ALWAYS_SOFTWARE=1
          timeout 1500 xvfb-run -a -s "-screen 0 1600x900x24" /tmp/gradle-9.2.1/bin/gradle --no-daemon :testmod:runClientTest 2>&1 | tail -400 > out/logs/client-test-console.log || true
          mkdir -p out/screenshots
          cp -r testmod/run-test/screenshots/* out/screenshots/ 2>/dev/null || true
          cp testmod/run-test/logs/latest.log out/logs/client-latest.log 2>/dev/null || true
          cp testmod/run-test/heliosphere-test-report.txt out/logs/ 2>/dev/null || true
          ls -R testmod/run-test | head -50 > out/logs/run-dir.txt || true
      - name: Push ci-output branch
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash tools/devlibs/push.sh ci-output
