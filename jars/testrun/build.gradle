// In-game check of the overlay jars. The released jars are mapped for production (their mixins carry
// intermediary names and no refmap), so they cannot run in the dev environment; this runs a real
// production client instead: Fabric Loader, Fabric API, the released mods with 01/06/10 replaced by
// build/dist-overlay, and this test mod, under the client game test harness, saving screenshots.
//   gradle :jars:01-core:mergeJar :jars:06-weapons:mergeJar :jars:10-disasters:mergeJar
//   gradle :jars:testrun:prodFxTest          (needs xvfb-run on Linux)
import net.fabricmc.loom.task.prod.ClientProductionRunTask

def overlay = rootProject.fileTree('build/dist-overlay') { include '*.jar' }
def released = rootProject.fileTree('base') { include '*.jar'; exclude '01-*', '06-*', '10-*' }

configurations { prodMods { transitive = false } }

dependencies {
    modCompileOnly files(overlay)
    modCompileOnly files(released)
    prodMods "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    // the client game test harness is not bundled in the fabric-api jar; take the module the build already uses
    prodMods fabricApi.module('fabric-client-gametest-api-v1', fabric_version)
}

tasks.register('prodFxTest', ClientProductionRunTask) {
    mods.from(overlay, released, configurations.prodMods, tasks.named('remapJar'))
    jvmArgs.addAll('-Dfabric.client.gametest', '-Dfabric.client.gametest.disableNetworkSynchronizer=true', '-Dheliosphere.skipIntro=true', '-Xmx4G')
    runDir = project.layout.projectDirectory.dir('run-fx')
    useXVFB = true
}
